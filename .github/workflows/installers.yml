name: TIGER Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python core and packager
        run: |
          python -m pip install -r services/core/requirements.txt pyinstaller
      - name: Package local TIGER Core
        env:
          PYTHONPATH: services/core
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name tiger-core --paths services/core --hidden-import app.main --collect-all uvicorn --collect-all fastapi --collect-all starlette --collect-all pydantic --collect-all pydantic_core --collect-all httpx services/core/launcher.py
          New-Item -ItemType Directory -Force apps/desktop/resources/bin | Out-Null
          Copy-Item dist/tiger-core.exe apps/desktop/resources/bin/tiger-core.exe
        shell: pwsh
      - name: Build shared web UI
        working-directory: apps/web
        run: |
          npm install
          npm run build
      - name: Build Windows installer
        working-directory: apps/desktop
        run: |
          npm install
          npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: TIGER-Windows-Installer
          path: apps/desktop/dist/*.exe
          if-no-files-found: error

  android-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Build Android web assets
        working-directory: apps/web
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android
      - name: Allow local Wi-Fi API connections
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/android/app/src/main/AndroidManifest.xml")
          data = path.read_text(encoding="utf-8")
          data = data.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          path.write_text(data, encoding="utf-8")
          PY
      - name: Build installable Android APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TIGER-Android-APK
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows-desktop, android-mobile]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TIGER-Windows-Installer
          path: release-assets/windows
      - uses: actions/download-artifact@v4
        with:
          name: TIGER-Android-APK
          path: release-assets/android
      - name: Publish installable apps
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/windows/*.exe
            release-assets/android/*.apk
