name: TIGER CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core test dependencies
        run: pip install -r services/core/requirements-dev.txt
      - name: Run core tests
        env:
          PYTHONPATH: services/core
        run: pytest -q services/core/tests

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm install
      - name: Build web interface
        working-directory: apps/web
        run: npm run build

  windows-script-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell scripts
        shell: pwsh
        run: |
          $files = @("scripts/setup-windows.ps1", "scripts/start-tiger.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
            Write-Host "PowerShell syntax OK: $file"
          }

  windows-desktop-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install core packager
        run: python -m pip install -r services/core/requirements.txt pyinstaller
      - name: Bundle local TIGER Core
        env:
          PYTHONPATH: services/core
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name tiger-core --paths services/core --hidden-import app.main --collect-all uvicorn --collect-all fastapi --collect-all starlette --collect-all pydantic --collect-all pydantic_core --collect-all httpx services/core/launcher.py
          New-Item -ItemType Directory -Force apps/desktop/resources/bin | Out-Null
          Copy-Item dist/tiger-core.exe apps/desktop/resources/bin/tiger-core.exe
      - name: Build shared web UI
        working-directory: apps/web
        run: |
          npm install
          npm run build
      - name: Build Windows installer
        working-directory: apps/desktop
        run: |
          npm install
          npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: TIGER-Windows-Installer
          path: apps/desktop/dist/*.exe
          if-no-files-found: error

  android-mobile-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - name: Build Android web assets
        working-directory: apps/web
        run: |
          npm install
          npm run build
          npx cap add android
          npx cap sync android
      - name: Allow local Wi-Fi API connections
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/android/app/src/main/AndroidManifest.xml")
          data = path.read_text(encoding="utf-8")
          data = data.replace("<application", '<application android:usesCleartextTraffic="true"', 1)
          path.write_text(data, encoding="utf-8")
          PY
      - name: Build installable Android APK
        working-directory: apps/web/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TIGER-Android-APK
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
